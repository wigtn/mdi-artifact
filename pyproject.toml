[project]
name = "mdi"
version = "0.1.0"
description = "Minimum Detectable Improvement (MDI) estimation framework for LLM-as-a-judge evaluation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
mdi = "mdi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W core + isort; D100/D104 enforce the module/package docstring rule (AGENTS.md §4).
select = ["E", "F", "W", "I", "D100", "D104"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]
